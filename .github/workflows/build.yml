name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk

      - name: Build and test
        run: mvn --batch-mode verify