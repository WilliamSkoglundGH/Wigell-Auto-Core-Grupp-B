spring.application.name=wigell-autocore

spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update

# Visa SQL-fragor.
spring.jpa.show-sql=true

#Loggning
logging.level.com.wac.autocore=DEBUG
logging.file.name=logs/autoCoreApp.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=2
logging.level.root=INFO
logging.charset.file=UTF-8
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} | %-5level | %logger{0} | %msg%n
